# Keep dependencies patched, but with humans in the loop:
# grouped weekly PRs are reviewable; auto-merge is intentionally NOT enabled
# (a malicious release published upstream should never flow in unreviewed).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node tracks the `engines.node` floor in package.json, not the
      # newest Node release. Bumping it would let the type checker accept APIs
      # that are missing on the oldest runtime we claim to support.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    # Security advisories still open individual PRs immediately.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
