name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the repo and nothing else.
# (No packages/write, no id-token, no PR write — nothing to steal.)
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs, not mutable tags,
      # so a compromised tag can't inject code into this pipeline.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      # Supply-chain gates run BEFORE installing anything.
      - name: Verify lockfile integrity (registry + sha512 only)
        run: node scripts/check-lockfile.js

      # `npm ci` + ignore-scripts (.npmrc): exact lockfile install, no
      # lifecycle scripts from dependencies ever execute in CI.
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package (verify the vsix builds and inspect contents)
        run: |
          npx @vscode/vsce package --out extension.vsix
          npx @vscode/vsce ls
